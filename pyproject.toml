[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openquii"
version = "0.2.2"
description = "Cross-platform local OpenQUII protocol core"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "OpenQUII contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.setuptools]
packages = ["openquii"]
package-dir = { openquii = "custom_components/openquii/core" }

[tool.setuptools.package-data]
openquii = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["python_tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "custom_components/openquii"
packages = ["core"]
